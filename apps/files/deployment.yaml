apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          ports:
            - containerPort: PORT_CONTAINER

          env:
            - name: FILES_SERVICE_HOST
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: FILES_SERVICE_HOST
            - name: ENV
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: DATABASE_URL
            - name: SHADOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: SHADOW_DATABASE_URL
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: EMAIL_PASS
            - name: ACCESS_TOKEN_EXPIRED_IN
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: ACCESS_TOKEN_EXPIRED_IN
            - name: REFRESH_TOKEN_EXPIRED_IN
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: REFRESH_TOKEN_EXPIRED_IN
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: JWT_SECRET_KEY
            - name: GOOGLE_RECAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: GOOGLE_RECAPTCHA_SECRET_KEY
            - name: GOOGLE_RECAPTCHA_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: GOOGLE_RECAPTCHA_SITE_KEY
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: ACCESS_KEY_ID
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: SECRET_ACCESS_KEY
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: MONGO_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: GOOGLE_CALLBACK_URL
            - name: FILES_SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: picassonova-files-production-config-secret
                  key: FILES_SERVICE_PORT
